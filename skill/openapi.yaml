openapi: 3.0.3

info:
  title: DOCX Generator Skill
  description: |
    ## 概述

    适用于 Dify 的 DOCX 文档生成 Skill。接收 JSON 数据和 DOCX 模板（Base64 编码），
    自动完成变量替换、表格循环填充、条件渲染，输出可下载的 Word 文件。

    ## 核心能力

    - **变量替换**：将 JSON 中的字段值注入模板占位符 `{{variable}}`
    - **表格循环**：根据 JSON 数组自动展开模板表格行
    - **条件渲染**：根据布尔值控制段落 / 行的显示与隐藏
    - **图片注入**：支持将 Base64 编码图片插入模板指定位置
    - **多格式输出**：生成标准 `.docx` 文件，兼容 Microsoft Word / WPS / Google Docs
  version: 1.1.0
  contact:
    name: DOCX Generator Skill
    url: https://github.com/linjingque56-max/dify-json-to-docx-skill

servers:
  - url: http://10.9.23.114:8080
    description: 局域网部署地址

paths:
  /v1/generate_docx:
    post:
      operationId: generate_docx
      summary: 生成 DOCX 文档
      description: |
        接收 JSON 数据、文件名和 DOCX 模板（Base64 编码），渲染模板后返回生成的 Word 文件下载链接。

        ### 参数说明

        | 参数 | 类型 | 必填 | 说明 |
        |------|------|------|------|
        | data | string | 是 | JSON 格式的结构化数据字符串 |
        | title | string | 是 | 生成文件名称（不含 .docx） |
        | template | string | 是 | DOCX 模板文件内容，Base64 编码 |

        ### template 参数说明

        由于 Dify 自定义工具对文件参数有单文件校验限制，
        本参数采用 Base64 编码字符串传递模板，完全规避文件校验问题。

        在 Tool 节点前添加 Code 节点，将文件变量编码为 Base64：

        ```python
        import base64

        def main(files: list) -> dict:
            if not files:
                return {"template_b64": ""}
            f = files[0]
            url = f.get("url", "")
            if url:
                import urllib.request
                content = urllib.request.urlopen(url).read()
                return {"template_b64": base64.b64encode(content).decode("utf-8")}
            content = f.get("content", f.get("blob", b""))
            if isinstance(content, str):
                content = content.encode("utf-8")
            return {"template_b64": base64.b64encode(content).decode("utf-8")}
        ```
      tags:
        - Document Generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - title
                - template
              properties:
                data:
                  type: string
                  description: JSON 格式的结构化数据字符串
                  example: '{"company":"示例科技有限公司","date":"2026-08-12","total":"80000.00"}'
                title:
                  type: string
                  description: 生成文件名称（不含 .docx 扩展名）
                  example: 2026年8月结算单-示例科技
                template:
                  type: string
                  description: DOCX 模板文件内容，Base64 编码字符串
                  example: UEsDBBQAAAAIAA...
      responses:
        '200':
          description: 文档生成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  file_url:
                    type: string
                    description: 生成的 DOCX 文件下载地址
                    example: http://127.0.0.1:8080/files/20260812_153000_abc123.docx
                  file_name:
                    type: string
                    example: 2026年8月结算单-示例科技.docx
                  file_size:
                    type: integer
                    example: 458752
                  generated_at:
                    type: string
                    example: "2026-08-12T15:30:00+08:00"
                  rendering_summary:
                    type: object
                    properties:
                      variables_replaced:
                        type: integer
                        example: 15
                      table_rows_generated:
                        type: integer
                        example: 3

        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: INVALID_JSON
                      message:
                        type: string
                        example: data 参数不是合法的 JSON 格式

        '422':
          description: 模板渲染失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: TEMPLATE_RENDER_ERROR
                      message:
                        type: string
                        example: 模板渲染失败

        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: INTERNAL_ERROR
                      message:
                        type: string
                        example: 文档生成过程中发生内部错误

  /v1/health:
    get:
      operationId: health_check
      summary: 健康检查
      description: 检查 Skill 服务是否正常运行
      tags:
        - Document Generation
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 1.1.0
                  timestamp:
                    type: string
                    example: "2026-08-12T15:30:00+08:00"
